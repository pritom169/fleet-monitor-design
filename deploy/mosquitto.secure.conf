# Production-style broker (SYSTEM_DESIGN.md §16): TLS only, a client certificate per robot, ACL from the registry.
# Certificates and the ACL come from backend/src/ops/pki.ts.
per_listener_settings false
allow_anonymous false
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key
tls_version tlsv1.2
require_certificate true
# The certificate's CN is the MQTT username, so the ACL below applies to the robot that owns the key.
use_identity_as_username true
acl_file /mosquitto/certs/acl
